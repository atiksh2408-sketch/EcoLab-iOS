<!doctype html>
<html lang="en">
<head>

<title>EcoLab — Digital Laboratory</title>
<style>
/* Layout: floating pill nav over a soft blue glass-style page; hero, subject cards, sample experiments, features; experiment pages hold a canvas simulation and a control panel. */
:root{
  --bg:#e9f0fc; --bg2:#f6efe9; --fg:#111a33; --muted:#5c6a86; --line:#d3ddef;
  --surface:rgba(255,255,255,.72); --surface-solid:#fbfcff; --accent:#3a6fe3; --accent2:#4aa8e0; --accent-soft:#dfe9fd;
  --sim:#f9fbff; --wire:#97a3b8; --good:#1f9d6b; --warn:#d98a1c; --shadow:0 10px 30px rgba(38,64,120,.10);
  --c-physics:#3a6fe3; --c-physics-s:#dce7fd; --c-chemistry:#8b5cf6; --c-chemistry-s:#ebe3fd;
  --c-biology:#1f9d6b; --c-biology-s:#d8f2e6; --c-environmental:#0e9aa7; --c-environmental-s:#d4f0f2;
  --c-mathematics:#d98a1c; --c-mathematics-s:#fbebcf;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1120; --bg2:#141029; --fg:#e8edf9; --muted:#97a4c2; --line:#26314d;
  --surface:rgba(24,33,58,.72); --surface-solid:#141c33; --accent:#6c96f5; --accent2:#56b4ea; --accent-soft:#1d2a4e;
  --sim:#0f1730; --wire:#56627e; --good:#3fc994; --warn:#f0a940; --shadow:0 10px 30px rgba(0,0,0,.35);
  --c-physics:#6c96f5; --c-physics-s:#1d2a4e; --c-chemistry:#a98af9; --c-chemistry-s:#2a2147;
  --c-biology:#3fc994; --c-biology-s:#123629; --c-environmental:#3fc3cf; --c-environmental-s:#0f3238;
  --c-mathematics:#f0a940; --c-mathematics-s:#3b2c0e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1120; --bg2:#141029; --fg:#e8edf9; --muted:#97a4c2; --line:#26314d;
  --surface:rgba(24,33,58,.72); --surface-solid:#141c33; --accent:#6c96f5; --accent2:#56b4ea; --accent-soft:#1d2a4e;
  --sim:#0f1730; --wire:#56627e; --good:#3fc994; --warn:#f0a940; --shadow:0 10px 30px rgba(0,0,0,.35);
  --c-physics:#6c96f5; --c-physics-s:#1d2a4e; --c-chemistry:#a98af9; --c-chemistry-s:#2a2147;
  --c-biology:#3fc994; --c-biology-s:#123629; --c-environmental:#3fc3cf; --c-environmental-s:#0f3238;
  --c-mathematics:#f0a940; --c-mathematics-s:#3b2c0e; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:linear-gradient(160deg,var(--bg) 0%,var(--bg) 55%,var(--bg2) 100%);background-attachment:fixed;color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1120px;margin:0 auto}
/* nav */
.nav{position:sticky;top:max(8px,env(safe-area-inset-top,0px));z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;padding-right:10px;flex:none}
.logo{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--accent2),var(--accent));font-size:19px}
.brand b{display:block;font-size:17px;line-height:1.1;letter-spacing:-.01em}
.brand small{display:block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.links{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links a{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:9px 14px;border-radius:999px;font-size:14.5px;font-weight:500;color:var(--fg)}
.links a:hover{background:var(--accent-soft)}
.links a.on{background:var(--accent-soft);color:var(--accent)}
.iconbtn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-solid);display:grid;place-items:center;font-size:18px}
.iconbtn:hover{background:var(--accent-soft)}
.back{display:none}
/* hero */
.hero{position:relative;text-align:center;padding:72px 0 56px}
.hero::before{content:"";position:absolute;inset:-60px -16px 0;z-index:-1;background:radial-gradient(520px 320px at 50% 28%,rgba(255,255,255,.65),transparent 70%),radial-gradient(420px 300px at 85% 10%,rgba(255,190,150,.35),transparent 70%),radial-gradient(420px 320px at 12% 40%,rgba(110,150,255,.28),transparent 70%)}
:root[data-theme="dark"] .hero::before{background:radial-gradient(520px 320px at 50% 28%,rgba(90,120,220,.22),transparent 70%),radial-gradient(420px 300px at 85% 10%,rgba(200,110,90,.14),transparent 70%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero::before{background:radial-gradient(520px 320px at 50% 28%,rgba(90,120,220,.22),transparent 70%),radial-gradient(420px 300px at 85% 10%,rgba(200,110,90,.14),transparent 70%)}}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--accent);font-size:14px;font-weight:500}
h1{font-size:clamp(40px,8vw,72px);line-height:1.02;letter-spacing:-.035em;font-weight:800;margin:26px auto 0;max-width:12em;text-wrap:balance}
h1 em{display:block;font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{max-width:640px;margin:22px auto 0;color:var(--muted);font-size:clamp(16px,2.4vw,19px);text-wrap:pretty}
.search{display:flex;align-items:center;gap:8px;max-width:520px;margin:34px auto 0;padding:6px 6px 6px 18px;background:var(--surface-solid);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow)}
.search svg{color:var(--muted);font-size:17px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;color:var(--fg);padding:10px 4px}
.search input::placeholder{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600;font-size:15px}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--surface-solid);color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{padding:8px 16px;font-size:14px}
/* sections */
section{padding:28px 0}
h2{font-size:clamp(24px,4vw,30px);letter-spacing:-.02em;margin:0;line-height:1.2}
.sub{color:var(--muted);margin:4px 0 0}
.grid{display:grid;gap:18px;margin-top:22px}
.g2{grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.subject{display:flex;flex-direction:column;gap:10px;padding:24px;min-height:210px;transition:transform .18s,box-shadow .18s}
.subject:hover{transform:translateY(-3px)}
.sicon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px}
.subject h3{margin:6px 0 0;font-size:19px}
.subject p{margin:0;color:var(--muted);flex:1}
.go{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:15px}
.soon{padding:24px;border-style:dashed;box-shadow:none;background:transparent;display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:210px}
.soon h3{margin:0}.soon p{margin:0;color:var(--muted)}
.exp{display:flex;flex-direction:column;gap:8px;padding:22px;transition:transform .18s}
.exp:hover{transform:translateY(-3px)}
.tag{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.exp h3{margin:0;font-size:19px}
.exp p{margin:0;color:var(--muted);flex:1;font-size:15px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:var(--surface-solid);border:1px solid var(--line);font-size:13px;color:var(--muted);font-weight:500}
.pill svg{color:var(--accent)}
.pill.l-Intermediate svg{color:var(--warn)}
.pill.l-Advanced svg{color:#d9534f}
.exp .go{margin-left:auto}
/* features */
.feature{padding:34px 28px;display:grid;gap:26px;grid-template-columns:1.1fr 1fr;align-items:center}
@media (max-width:760px){.feature{grid-template-columns:1fr}}
.eyebrow{color:var(--accent);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.feature p{color:var(--muted);margin:12px 0 0;text-wrap:pretty}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.checks li{display:flex;align-items:center;gap:12px;font-weight:500}
.checks .tick{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.chips span{padding:6px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:500}
footer{padding:36px 0 40px;text-align:center;color:var(--muted);font-size:14px}
/* subject + experiment pages */
.crumb{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14.5px;margin-top:34px}
.crumb:hover{color:var(--accent)}
.page-head{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;margin-top:14px}
.page-head h1{font-size:clamp(32px,6vw,46px);margin:0;text-align:left;max-width:none;letter-spacing:-.03em}
.page-head p{margin:8px 0 0;color:var(--muted);max-width:560px}
.simcard{margin-top:24px;padding:0;overflow:hidden;background:var(--sim)}
canvas{display:block;width:100%;aspect-ratio:5/3;height:auto}
.panel{margin-top:18px;padding:22px}
.panel-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.panel-top h3{margin:0;font-size:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.sliders{display:grid;gap:18px;margin-top:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.sl label{display:flex;justify-content:space-between;gap:8px;font-weight:500;font-size:15px}
.sl label output{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);margin:8px 0 0;height:22px}
.reads{display:grid;gap:12px;margin-top:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.read{padding:14px 16px;border-radius:18px;background:var(--surface-solid);border:1px solid var(--line)}
.read small{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.read b{display:block;font-size:22px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.note{color:var(--muted);margin:18px 0 0;font-size:15px;text-wrap:pretty}
.todo{margin-top:24px;padding:40px 24px;text-align:center}
.todo h3{margin:0 0 6px}.todo p{margin:0 auto;max-width:480px;color:var(--muted)}
.empty{padding:40px 0;color:var(--muted)}
@media (max-width:560px){.brand small{display:none}.links a{padding:9px 11px;font-size:14px}.hero{padding-top:48px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function alongPath(pts,d){var tot=0,i,L=[];for(i=0;i<pts.length-1;i++){var l=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);L.push(l);tot+=l}
