
name: Build EcoLab IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Build iOS app
        run: |
          xcodebuild \
            -project EcoLab.xcodeproj \
            -scheme EcoLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EcoLab.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/EcoLab.xcarchive/Products/Applications/EcoLab.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -r "$GITHUB_WORKSPACE/EcoLab-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EcoLab-unsigned-IPA
          path: EcoLab-unsigned.ipa
